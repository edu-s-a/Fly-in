[project]
name = "fly-in"
requires-python = "^3.10"
dependencies = ["pydantic (>=2.13.4,<3.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.poetry]
package-mode = false